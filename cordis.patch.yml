# dsh-browser-use — a DeepSeek Harness profile bundle.
#
# It inserts the shared browser-use seam (`@deepseek-ai/dsh-browser-use`) and the
# Playwright MCP provider (`@deepseek-ai/dsh-experimental-browser-use-playwright-mcp`).
# There is exactly one browser-use provider per profile: do not mount another.
#
# Default: launch a dedicated visible Chromium per live Session.
# To drive your installed Google Chrome instead, override this row in your
# profile's cordis.patch.yml (an override replaces the whole `config`):
#
#   - id: browser-use-playwright-mcp
#     name: '@deepseek-ai/dsh-experimental-browser-use-playwright-mcp'
#     config:
#       mode: launch
#       headless: false
#       executablePath: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
#
# Or attach to an already-running browser with CDP:
#
#   config:
#     mode: attach
#     endpoint: 'http://127.0.0.1:9222'
- insert:
    - id: browser-use
      name: '@deepseek-ai/dsh-browser-use'
    - id: browser-use-playwright-mcp
      name: '@deepseek-ai/dsh-experimental-browser-use-playwright-mcp'
      config:
        mode: launch
        headless: false
